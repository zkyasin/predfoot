name: docker

# Builds the CPU image and runs the tracer bullet inside it. Nothing is pushed: the repository is private and
# GHCR storage is limited; publishing images is the release workflow's job (T5.3).
on:
  pull_request:
    paths:
      - "docker/**"
      - ".dockerignore"
      - "src/**"
      - "pyproject.toml"
      - "uv.lock"
      - "tests/fixtures/synthetic_clip.json"
      - ".github/workflows/docker.yml"
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the CPU image (loaded locally, not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.cpu
          tags: predfoot:ci
          load: true
          push: false
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Runs as a non-root user
        run: test "$(docker run --rm --entrypoint id predfoot:ci -u)" != "0"

      - name: predfoot run on the synthetic clip
        run: |
          mkdir -p out
          chmod 0777 out  # the container user (uid 10001) writes here
          docker run --rm -v "$PWD/tests/fixtures:/in:ro" -v "$PWD/out:/out" \
            predfoot:ci run /in/synthetic_clip.json --out /out --fps 10

      - name: predfoot validate on the result
        run: |
          docker run --rm -v "$PWD/out:/out:ro" \
            predfoot:ci validate /out/tracking.jsonl --match /out/match.json
          test -s out/minimap.png
          jq -e '.frames.exported == 30 and .frames.abstained == 4' out/metrics.json
          jq -e --arg sha "$GITHUB_SHA" '.git_sha == $sha' out/meta.json

      - name: Image size
        run: docker image ls predfoot:ci

      - uses: actions/upload-artifact@v4
        with:
          name: tracer-bullet-output
          path: out/
          retention-days: 7
