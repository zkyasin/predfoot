name: docker

# Builds both CPU images (targets cli and serve) and smoke-tests them with docker/smoke-cli.sh and
# docker/smoke-serve.sh, the same scripts release.yml runs before it pushes. Nothing is pushed here:
# publishing is the job of release.yml, on version tags.
on:
  pull_request:
    paths:  # every file the image copies or the smoke tests read (tests/unit/test_docker_files.py checks it)
      - "docker/**"
      - ".dockerignore"
      - "src/**"
      - "pyproject.toml"
      - "uv.lock"
      - "README.md"
      - "LICENSE"
      - "ATTRIBUTION.md"
      - "tests/fixtures/synthetic_clip.json"
      - "tests/fixtures/golden/**"
      - ".github/workflows/docker.yml"
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cli:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the cli image (default target; loaded locally, not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.cpu
          tags: predfoot:cli
          load: true
          push: false
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=cli
          cache-to: type=gha,mode=max,scope=cli

      - name: Smoke test (non-root user, run, validate, QA report, golden outputs)
        env:
          EXPECTED_GIT_SHA: ${{ github.sha }}
        run: docker/smoke-cli.sh predfoot:cli

      - name: Image size
        run: docker image ls predfoot:cli

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tracer-bullet-output
          path: smoke/out/
          retention-days: 7

  serve:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the serve image (loaded locally, not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.cpu
          target: serve
          tags: predfoot:serve
          load: true
          push: false
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=serve
          cache-to: type=gha,mode=max,scope=serve

      - name: Smoke test of the command-line tools in the serve image
        env:
          EXPECTED_GIT_SHA: ${{ github.sha }}
        run: docker/smoke-cli.sh predfoot:serve

      - name: Smoke test of the HTTP API (HEALTHCHECK, /healthz, /v1/localize, /v1/calibrate, /metrics)
        run: docker/smoke-serve.sh predfoot:serve

      - name: Image size
        run: docker image ls predfoot:serve
