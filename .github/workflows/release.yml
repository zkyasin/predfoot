name: release

# On a version tag (v*), builds both CPU images and pushes them to the GitHub Container Registry as
# ghcr.io/zkyasin/predfoot: the cli image tagged <version> and sha-<commit>, the serve image with the same
# tags and a -serve suffix (0.1.0-serve, sha-<commit>-serve). OCI labels give the source repository,
# revision, version and licence. GITHUB_TOKEN is the only credential.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: cli
            suffix: ""
          - target: serve
            suffix: "-serve"
    steps:
      - uses: actions/checkout@v4

      - name: The tag names the package version
        id: version
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match the version in pyproject.toml ($version)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Tags and OCI labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/zkyasin/predfoot
          flavor: |
            latest=false
            suffix=${{ matrix.suffix }},onlatest=true
          tags: |
            type=semver,pattern={{version}}
            type=sha
          labels: |
            org.opencontainers.image.title=predfoot${{ matrix.suffix }}
            org.opencontainers.image.description=Calibrated position uncertainty for broadcast football tracking (${{ matrix.target }} image, CPU, no torch)
            org.opencontainers.image.licenses=Apache-2.0

      - name: Build and load locally
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.cpu
          target: ${{ matrix.target }}
          load: true
          push: false
          tags: predfoot:release
          build-args: |
            GIT_SHA=${{ github.sha }}
            VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=release-${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.target }}

      - name: Smoke test before pushing
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          test "$(docker run --rm --entrypoint id predfoot:release -u)" != "0"
          test "$(docker run --rm --entrypoint predfoot predfoot:release version)" = "$VERSION"
          mkdir -p out
          chmod 0777 out
          docker run --rm --entrypoint predfoot -v "$PWD/tests/fixtures:/in:ro" -v "$PWD/out:/out" \
            predfoot:release run /in/synthetic_clip.json --out /out
          docker run --rm --entrypoint predfoot -v "$PWD/out:/out:ro" \
            predfoot:release validate /out/tracking.jsonl --match /out/match.json

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to ghcr.io (same build, from the cache)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.cpu
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=release-${{ matrix.target }}

      - name: Pushed tags
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: echo "$TAGS"
