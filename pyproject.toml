[project]
name = "predfoot"
version = "0.0.1"
description = "Calibrated position uncertainty for broadcast football tracking"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.14"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "opencv-python-headless>=4.10",
    "polars>=1.10",
    "pyarrow>=17",
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "typer>=0.12",
    "jsonschema>=4.23",
    "matplotlib>=3.9",
    "huggingface-hub>=0.26",
    "scikit-learn>=1.9.1",
]

[project.optional-dependencies]
# Neural networks (keypoint model, critic). Kept out of CI to keep it fast.
vision = ["torch>=2.5", "torchvision>=0.20"]
# HTTP API (`predfoot serve`): python-multipart parses the uploads of /v1/calibrate, pillow reads image headers.
serve = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "prometheus-client>=0.21",
    "python-multipart>=0.0.18",
    "pillow>=10",
]
# ONNX export of the keypoint networks and ONNX Runtime inference (scripts/export_onnx.py, bench_latency.py).
export = ["onnx>=1.17", "onnxruntime>=1.20", "onnxscript>=0.3"]
cloud = [
    "modal>=1.6",
]

[project.scripts]
predfoot = "predfoot.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "hypothesis>=6.112",
    "ruff>=0.7",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "pip-licenses>=5.0",
    "kloppy>=3.15",
    "types-pyyaml",
    "httpx2>=2.0",  # HTTP client of fastapi.testclient (starlette prefers httpx2 to httpx)
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/predfoot"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests", "scripts"]
# Third-party MIT model definition, kept as close to upstream as possible.
extend-exclude = ["src/predfoot/keypoints/hrnet_mit.py"]
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "NPY", "RUF", "PT"]
# Maths symbols (σ, θ, ×, ≈) are welcome in docstrings and comments.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
disallow_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true
exclude = ["src/predfoot/keypoints/hrnet_mit\\.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: long statistical or end-to-end tests (nightly)",
    "data: needs datasets downloaded under PREDFOOT_DATA_DIR",
    "network: needs internet access",
    "vision: needs torch (extra 'vision')",
]
