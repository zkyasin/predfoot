[project]
name = "predfoot"
version = "0.0.1"
description = "Calibrated position uncertainty for broadcast football tracking"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.14"
authors = [{ name = "Ya-Sin" }]
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "opencv-python-headless>=4.10",
    "polars>=1.10",
    "pyarrow>=17",
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "typer>=0.12",
    "jsonschema>=4.23",
    "matplotlib>=3.9",
    "huggingface-hub>=0.26",
]

[project.optional-dependencies]
# Neural networks (keypoint model, critic). Kept out of CI to keep it fast.
vision = ["torch>=2.5", "torchvision>=0.20"]
serve = ["fastapi>=0.115", "uvicorn>=0.30"]
export = ["onnx>=1.17", "onnxruntime>=1.20"]

[project.scripts]
predfoot = "predfoot.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "hypothesis>=6.112",
    "ruff>=0.7",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "pip-licenses>=5.0",
    "kloppy>=3.15",
    "types-pyyaml",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/predfoot"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "NPY", "RUF", "PT"]
# Maths symbols (σ, θ, ×, ≈) are welcome in docstrings and comments.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
disallow_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: long statistical or end-to-end tests (nightly)",
    "data: needs datasets downloaded under PREDFOOT_DATA_DIR",
    "network: needs internet access",
    "vision: needs torch (extra 'vision')",
]
